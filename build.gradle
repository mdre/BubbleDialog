// saltar autoBuildNumber
task sabn {}

task createMavenPom {
    doLast {
        println "creando el POM..."
        // [MIGRADO] el POM se genera via maven-publish; este task queda como auxiliar si se necesita manualmente
        def pomDir = file("build/resources/main/META-INF/maven/$project.group/$project.name")
        pomDir.mkdirs()

        file("${pomDir}/pom.properties").text = """\
            version=$project.version
            groupId=$project.group
            artifactId=$project.name
            """.stripIndent()
    }
}

